<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Termini — Web Terminal</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="terminal.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Termini <span>· web terminal</span></h1>
      <div class="controls">
        <label class="field">
          <span>Node</span>
          <select id="node-select" data-testid="node-select"></select>
        </label>
        <button id="connect-btn" class="btn btn-primary" data-testid="connect">Connect</button>
        <button id="reconnect-btn" class="btn" data-testid="reconnect">Reconnect</button>
        <span id="conn-state" class="conn-state" data-testid="conn-state">idle</span>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main class="layout">
      <section class="term-wrap">
        <div id="terminal" data-testid="terminal"></div>
      </section>
      <aside id="ssh-panel-root" data-testid="ssh-panel"></aside>
    </main>

    <!-- Vendored xterm.js 6.0.0 + @xterm/addon-fit 0.11.0 (MIT) UMD builds. -->
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
