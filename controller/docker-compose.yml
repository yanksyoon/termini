services:
  controller:
    build:
      context: ..
      dockerfile: controller/Dockerfile
    ports:
      - "${TERMINI_PORT:-8080}:8080"
    environment:
      TERMINI_BOOTSTRAP_TOKEN: "${TERMINI_BOOTSTRAP_TOKEN:?set TERMINI_BOOTSTRAP_TOKEN}"
      TERMINI_PROJECT_TOKEN: "${TERMINI_PROJECT_TOKEN:-}"
      TERMINI_PROJECT_ID: "${TERMINI_PROJECT_ID:-}"
      TERMINI_MAX_INFERENCE_NODES: "${TERMINI_MAX_INFERENCE_NODES:-1}"
      TERMINI_GPU_VRAM_MIN_BYTES: "${TERMINI_GPU_VRAM_MIN_BYTES:-12884901888}"
      TERMINI_MIN_REDACTOR_VERSION: "${TERMINI_MIN_REDACTOR_VERSION:-3}"
      TERMINI_TELEMETRY_INTERVAL_MS: "${TERMINI_TELEMETRY_INTERVAL_MS:-1000}"
      # W5 dashboard surfaces
      TERMINI_INVENTORY_PATH: "${TERMINI_INVENTORY_PATH:-/data/inventory.json}"
      TERMINI_SSH_CA_KEY_PATH: "${TERMINI_SSH_CA_KEY_PATH:-}"
      TERMINI_SSH_CA_PUBLIC_KEY: "${TERMINI_SSH_CA_PUBLIC_KEY:-}"
      TERMINI_SSH_OPERATOR_KEY_PATH: "${TERMINI_SSH_OPERATOR_KEY_PATH:-~/.termini/operator_key}"
      TERMINI_SSH_KEY_COMMENT: "${TERMINI_SSH_KEY_COMMENT:-termini-operator-cert}"
      TERMINI_SSH_CERT_PRINCIPAL: "${TERMINI_SSH_CERT_PRINCIPAL:-root}"
      TERMINI_SSH_CERT_DEFAULT_VALIDITY_S: "${TERMINI_SSH_CERT_DEFAULT_VALIDITY_S:-28800}"
      TERMINI_SSH_CERT_MAX_VALIDITY_S: "${TERMINI_SSH_CERT_MAX_VALIDITY_S:-86400}"
      TERMINI_SSH_USER: "${TERMINI_SSH_USER:-ubuntu}"
      TERMINI_TERMINAL_BACKEND: "${TERMINI_TERMINAL_BACKEND:-ssh}"
    volumes:
      - controller-data:/data

volumes:
  controller-data:
