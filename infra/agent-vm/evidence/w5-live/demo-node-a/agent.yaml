# Termini agent VM runtime config — BAKED DEFAULT.
#
# cloud-init renders the authoritative /etc/termini/agent.yaml at launch
# (agent-runtime.md §4.4). This baked copy lets termini-agent.service start and
# serve /status even before cloud-init runs (e.g. an offline bake-inspection boot).
project_id: 01J00000000000000000000000
vm_id: 01J00000000000000000000001
node_id: 01J00000000000000000000002
agent_image_version: agent-vm-2026.10.0
inference:
  base_url: http://10.10.0.13:8080
  default_model: gemma
  allowed_models: [gemma]
  token_file: /etc/termini/inference.token
  stream: true
  connect_timeout_s: 2
  request_timeout_s: 120
broker:
  endpoint: http://10.20.1.1:7071
  pull_interval_s: 1
  max_concurrent_tasks: 2
# Task-submit surface (agent-runtime.md §5.6). The per-instance bound is what keeps
# a client's task load from saturating the node.
tasks:
  max_concurrent: 2
  result_sink: /var/lib/termini/agent/results
logging:
  sink: /var/log/termini/agent.jsonl
  local_only: true
governance:
  telemetry_class: C0
  egress: deny
