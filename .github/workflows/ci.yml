name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON files
        run: |
          rc=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || rc=1
          done < <(git ls-files '*.json')
          exit $rc

      - name: Check example identifiers are 26-char ULIDs
        run: python3 scripts/check-doc-ulids.py

      - name: Check README links resolve
        run: python3 scripts/check-readme-links.py

      - name: Python syntax check
        run: |
          rc=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" || rc=1
          done < <(git ls-files '*.py')
          exit $rc

      - name: Install the agent runtime's config dependency
        # `tests/test_agent_tasks.py` wires the shipped in-VM runtime against the real
        # controller, so it loads the instance's own `/etc/termini/agent.yaml` through
        # `termini_agent.config.load_config()`. That module parses YAML, which the
        # agent runtime declares in `image/agent-vm/requirements/runtime.in`. Nothing
        # else in `tests/` needs a third-party package; this step keeps the suite real
        # instead of stubbing the loader out (the full runtime venv is far too heavy
        # for CI — `runtime.lock` pulls in google-adk/langgraph).
        run: python3 -m pip install --quiet "PyYAML>=6,<7"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Shellcheck scripts (if any)
        run: |
          if git ls-files '*.sh' | grep -q .; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            git ls-files '*.sh' | xargs -r shellcheck -S warning
          fi

      - name: Guard against committed secret-shaped paths
        run: |
          if git ls-files | grep -nE '(^|/)\.env($|\.)|(^|/)\.ssh/|(^|/)\.hermes/|\.pem$|\.key$|(^|/)id_rsa|(^|/)id_ed25519'; then
            echo "::error::secret-shaped paths are tracked in git"; exit 1
          fi
          echo "no secret-shaped paths tracked"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dashboard unit tests (pure core modules, no deps)
        run: node --test dashboard/tests/core.test.mjs

      - name: Web terminal unit tests (framing, session FSM, ssh panel)
        run: node --test frontend/test/*.test.mjs
